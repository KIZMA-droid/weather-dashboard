# Fetches PAGASA's live river and dam levels every 15 minutes and publishes them as ffws.json on a
# separate "data" branch, where the dashboard can read them. PAGASA's own feed cannot be read directly
# by a web page, so this job acts as the relay for the online copy of the dashboard.
#
# The data branch is overwritten each run (a single commit), so it never bloats the repository.
name: Update PAGASA water levels

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: water-levels
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Complete PAGASA's certificate chain
        # PAGASA's server sends only its own certificate and leaves out the intermediate one that links it to
        # a trusted root. Windows fetches the missing piece by itself; Linux does not, so curl fails with
        # exit code 60. Fetch the intermediate from the address named inside PAGASA's certificate, and use
        # it only after confirming it chains to a root this machine already trusts.
        run: |
          set -euo pipefail
          host=pasig-marikina-tullahanffws.pagasa.dost.gov.ph
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null | openssl x509 -out site.pem
          issuer_url=$(openssl x509 -in site.pem -noout -ext authorityInfoAccess | grep 'CA Issuers' | grep -o 'http[^[:space:]]*' | head -n 1)
          echo "Intermediate certificate: $issuer_url"
          curl --fail --silent --show-error --max-time 30 "$issuer_url" -o issuer.bin
          openssl x509 -inform DER -in issuer.bin -out issuer.pem 2>/dev/null || openssl x509 -in issuer.bin -out issuer.pem
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt issuer.pem
          cat /etc/ssl/certs/ca-certificates.crt issuer.pem > trusted.pem

      - name: Fetch PAGASA flood forecasting stations
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 2 --cacert trusted.pem \
            -A "atmos-dashboard (github.com/${{ github.repository }})" \
            "https://pasig-marikina-tullahanffws.pagasa.dost.gov.ph/water/main_list.do" -o ffws.json
          # Refuse to publish anything that is not a non-empty list of stations.
          python3 -c "import json; d = json.load(open('ffws.json')); assert isinstance(d, list) and d and 'obsnm' in d[0], 'unexpected response'; print(len(d), 'stations')"

      - name: Publish to the data branch
        run: |
          rm -f site.pem issuer.bin issuer.pem trusted.pem
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffws.json
          git commit -q -m "PAGASA water levels $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
